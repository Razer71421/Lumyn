<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumyn - Study Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Nunito Sans"', 'sans-serif'],
                        heading: ['"Poppins"', 'sans-serif'],
                    },
                    colors: {
                        primary: 'var(--color-primary)',
                        secondary: 'var(--color-secondary)',
                        bg: 'var(--color-bg)',
                        card: 'var(--color-card)',
                        text: 'var(--color-text)',
                        accent: 'var(--color-accent)',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-1000px 0' },
                            '100%': { backgroundPosition: '1000px 0' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        tick: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.2)' },
                            '100%': { transform: 'scale(1)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        breathe: {
                            '0%, 100%': { transform: 'scale(1)', opacity: '0.3' },
                            '50%': { transform: 'scale(1.35)', opacity: '0.1' }
                        },
                        breathe3D: {
                            '0%, 100%': { 
                                transform: 'scale(0.85)', 
                                boxShadow: 'inset -20px -20px 50px rgba(0,0,0,0.2), inset 10px 10px 30px rgba(255,255,255,0.8), 0 0 20px rgba(116, 198, 157, 0.3)' 
                            },
                            '50%': { 
                                transform: 'scale(1.15)', 
                                boxShadow: 'inset -20px -20px 50px rgba(0,0,0,0.1), inset 10px 10px 30px rgba(255,255,255,0.9), 0 0 60px 15px rgba(116, 198, 157, 0.6)' 
                            }
                        }
                    },
                    animation: {
                        shimmer: 'shimmer 2s infinite linear',
                        fadeIn: 'fadeIn 0.5s ease-out forwards',
                        tick: 'tick 0.3s ease-in-out',
                        float: 'float 6s ease-in-out infinite',
                        breathe: 'breathe 8s infinite ease-in-out',
                        breathe3D: 'breathe3D 8s infinite ease-in-out',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #D8F3DC;
            --color-secondary: #B7E4C7;
            --color-bg: #F9FFF9;
            --color-card: #FAF9F6;
            --color-text: #344E41;
            --color-accent: #74C69D;
        }
        .dark {
            --color-primary: #1A2D27;
            --color-secondary: #2A4C3A;
            --color-bg: #121212;
            --color-card: #1E1E1E;
            --color-text: #EAEAEA;
            --color-accent: #74C69D;
        }
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Liquid Glassmorphism - iOS Style */
        .glassmorphism {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        
        .dark .glassmorphism {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-secondary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-accent);
        }
        /* Flip Card */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Beautiful Range Slider */
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 6px;
            background: rgba(128, 128, 128, 0.1);
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid var(--color-accent);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: -7px; /* Align thumb */
        }

        .range-slider::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 6px;
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        .range-slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid var(--color-accent);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        /* 3D Breathing Sphere */
        .sphere-3d {
            /* Complex gradient for depth */
            background: radial-gradient(
                circle at 30% 30%, 
                rgba(255, 255, 255, 0.95) 0%, 
                rgba(183, 228, 199, 0.6) 25%,
                rgba(116, 198, 157, 0.4) 50%, 
                rgba(52, 78, 65, 0.2) 85%,
                rgba(27, 67, 50, 0.4) 100%
            );
            box-shadow: 
                inset -25px -25px 60px rgba(0, 0, 0, 0.1),
                inset 10px 10px 30px rgba(255, 255, 255, 0.9),
                0 20px 50px rgba(116, 198, 157, 0.4);
            position: relative;
            border-radius: 50%;
        }
        
        /* Glossy Highlight Reflection */
        .sphere-3d::after {
            content: '';
            position: absolute;
            top: 12%;
            left: 15%;
            width: 30%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.1) 60%, transparent 100%);
            transform: rotate(-45deg);
            filter: blur(2px);
        }
        
        /* Inner glow for life-like effect */
        .sphere-3d::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(116, 198, 157, 0.3) 0%, transparent 70%);
            mix-blend-mode: overlay;
        }

        .dark .sphere-3d {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.5) 0%, 
                rgba(42, 76, 58, 0.8) 40%, 
                rgba(18, 31, 24, 0.9) 80%,
                rgba(0, 0, 0, 1) 100%
            );
            box-shadow: 
                inset -20px -20px 50px rgba(0, 0, 0, 0.9),
                inset 5px 5px 20px rgba(255, 255, 255, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.6);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
